data_path: data/raw/flights.csv
output_dir: reports/dl
seed: 42
device: cpu

training:
  optimizer: adamw
  epochs: 20
  patience: 4
  min_delta: 0.0001

search:
  trials:
    - learning_rate: 0.001
      batch_size: 1024
      hidden_dims: [128, 64]
      dropout: 0.1
      weight_decay: 0.0001
    - learning_rate: 0.0005
      batch_size: 1024
      hidden_dims: [128, 64]
      dropout: 0.1
      weight_decay: 0.0001
    - learning_rate: 0.001
      batch_size: 512
      hidden_dims: [128, 64]
      dropout: 0.1
      weight_decay: 0.0001
    - learning_rate: 0.001
      batch_size: 1024
      hidden_dims: [64, 32]
      dropout: 0.1
      weight_decay: 0.0001
    - learning_rate: 0.001
      batch_size: 1024
      hidden_dims: [128, 64]
      dropout: 0.3
      weight_decay: 0.0001
    - learning_rate: 0.001
      batch_size: 1024
      hidden_dims: [128, 64]
      dropout: 0.1
      weight_decay: 0.001
